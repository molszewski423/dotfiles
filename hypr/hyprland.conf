# ── Variables ─────────────────────────────────────────────────────────────────
$mod   = SUPER
$term  = kitty
$files = nautilus
$menu  = wofi --show drun --prompt "  Apps"
$lock  = hyprlock

# ── Monitor ───────────────────────────────────────────────────────────────────
monitor = DP-2, 1920x1080@60, 0x0, 1
monitor = eDP-1, 1920x1080@60, 1920x0, 1

# ── Autostart ─────────────────────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface font-name 'JetBrainsMono Nerd Font Mono 11'
exec-once = mako
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hyprpaper
exec-once = sleep 1 && hyprctl hyprpaper wallpaper "eDP-1,/home/mike/Pictures/wp1.jpeg"
exec-once = waybar
exec-once = hypridle

# ── General ───────────────────────────────────────────────────────────────────
general {
    gaps_in  = 2 6 2 6
    gaps_out = -4
    border_size = 2
    col.active_border   = rgba(bb9af7ff)
    col.inactive_border = rgba(292e42ff)
    layout = dwindle
    allow_tearing = false
}

# ── Appearance ────────────────────────────────────────────────────────────────
decoration {
    rounding = 8

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# ── Animations ────────────────────────────────────────────────────────────────
animations {
    enabled = true

    bezier = swift, 0.05, 0.9, 0.1, 1.05
    bezier = easeOut, 0.0, 0.0, 0.2, 1.0

    animation = windows,    1, 4, swift
    animation = windowsOut, 1, 4, easeOut, popin 80%
    animation = border,     1, 10, default
    animation = fade,       1, 4, default
    animation = workspaces, 1, 4, easeOut, slide
}

# ── Input ─────────────────────────────────────────────────────────────────────
input {
    kb_options    = caps:escape
    follow_mouse  = 1
    sensitivity   = 0

    touchpad {
        tap-to-click          = true
        natural_scroll        = true
        disable_while_typing  = true
    }
}

# ── Misc ──────────────────────────────────────────────────────────────────────
misc {
    font_family              = JetBrainsMono Nerd Font Mono
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
}

# ── Layout ────────────────────────────────────────────────────────────────────
dwindle {
    preserve_split = true
}

# ── Window rules ──────────────────────────────────────────────────────────────
windowrule = float class:^(wofi)$
windowrule = float class:^(org.gnome.Calendar)$
windowrule = size 900 650 class:^(org.gnome.Calendar)$
windowrule = float class:^(sway-keybinds)$
windowrule = size 740 580 class:^(sway-keybinds)$
windowrule = center class:^(sway-keybinds)$

# ── Keybindings ───────────────────────────────────────────────────────────────

# Launch
bind = $mod,       Return,   exec, $term
bind = $mod SHIFT, F,        exec, $files
bind = $mod SHIFT, B,        exec, brave-browser
bind = $mod,       D,        exec, $menu
bind = $mod,       Q,        killactive
bind = $mod SHIFT, C,        exec, hyprctl reload
bind = $mod SHIFT, E,        exec, hyprctl dispatch exit

# Focus (vim + arrows)
bind = $mod, H,     movefocus, l
bind = $mod, J,     movefocus, d
bind = $mod, K,     movefocus, u
bind = $mod, L,     movefocus, r
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod, right, movefocus, r

# Move
bind = $mod SHIFT, H,     movewindow, l
bind = $mod SHIFT, J,     movewindow, d
bind = $mod SHIFT, K,     movewindow, u
bind = $mod SHIFT, L,     movewindow, r
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, right, movewindow, r

# Workspaces
bind = $mod,       1, workspace, 1
bind = $mod,       2, workspace, 2
bind = $mod,       3, workspace, 3
bind = $mod,       4, workspace, 4
bind = $mod,       5, workspace, 5
bind = $mod,       6, workspace, 6
bind = $mod,       7, workspace, 7
bind = $mod,       8, workspace, 8
bind = $mod,       9, workspace, 9
bind = $mod,       0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Layout — dwindle
bind = $mod,       B,     layoutmsg, preselect r
bind = $mod,       V,     layoutmsg, preselect d
bind = $mod,       E,     layoutmsg, togglesplit
bind = $mod,       F,     fullscreen
bind = $mod SHIFT, SPACE, togglefloating
bind = $mod,       SPACE, cyclenext

# Scratchpad
bind = $mod SHIFT, MINUS, movetoworkspace, special:scratch
bind = $mod,       MINUS, togglespecialworkspace, scratch

# Resize submap
bind = $mod, R, submap, resize

submap = resize
binde = , H,     resizeactive, -20 0
binde = , J,     resizeactive, 0 20
binde = , K,     resizeactive, 0 -20
binde = , L,     resizeactive, 20 0
binde = , left,  resizeactive, -20 0
binde = , down,  resizeactive, 0 20
binde = , up,    resizeactive, 0 -20
binde = , right, resizeactive, 20 0
bind  = , Return, submap, reset
bind  = , Escape, submap, reset
submap = reset

# Screenshots (saves to ~/Pictures and copies to clipboard)
bind = $mod,       S, exec, /home/mike/.local/bin/screenshot.sh
bind = $mod SHIFT, S, exec, /home/mike/.local/bin/screenshot.sh window

# Lock
bind = $mod CTRL, L, exec, $lock

# Media / hardware keys
binde = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ && pkill -RTMIN+8 waybar
binde = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && pkill -RTMIN+8 waybar
bind  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && pkill -RTMIN+8 waybar
bind  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86MonBrightnessUp,   exec, brightnessctl set +10%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Lid switch
bindl = , switch:on:Lid Switch,  exec, hyprctl dispatch dpms off eDP-1
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on eDP-1
